<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="60%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="fieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="fieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="fieldGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="520" fill="url(#skyGrad)" rx="16" />

  <!-- Sun -->
  <circle cx="580" cy="140" r="70" fill="url(#sunGrad)" />

  <!-- Distant Hills -->
  <path d="M0 290 Q 200 240, 420 280 T 800 270 L 800 520 L 0 520 Z" fill="#bbf7d0" opacity="0.6" />
  <path d="M0 320 Q 260 270, 520 310 T 800 300 L 800 520 L 0 520 Z" fill="#86efac" opacity="0.7" />

  <!-- Agricultural Crop Terraces / Fields -->
  <path d="M0 350 Q 180 320, 390 350 T 800 330 L 800 520 L 0 520 Z" fill="url(#fieldGrad2)" />
  <path d="M0 390 Q 230 360, 480 390 T 800 370 L 800 520 L 0 520 Z" fill="url(#fieldGrad1)" />

  <!-- Field Furrow Lines / Crops -->
  <path d="M120 400 L 40 520 M200 400 L 160 520 M280 400 L 290 520 M360 400 L 420 520 M440 400 L 550 520 M520 400 L 680 520 M600 400 L 800 500" stroke="#14532d" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Foreground Crops (Sprouts) -->
  <g fill="#4ade80" stroke="#14532d" stroke-width="2">
    <!-- Sprout 1 -->
    <path d="M160 480 Q 145 455, 130 460 Q 145 470, 160 480 Z" fill="#86efac" />
    <path d="M160 480 Q 175 455, 190 460 Q 175 470, 160 480 Z" fill="#86efac" />
    <line x1="160" y1="480" x2="160" y2="495" stroke="#15803d" stroke-width="3" />

    <!-- Sprout 2 -->
    <path d="M300 475 Q 285 450, 270 455 Q 285 465, 300 475 Z" fill="#86efac" />
    <path d="M300 475 Q 315 450, 330 455 Q 315 465, 300 475 Z" fill="#86efac" />
    <line x1="300" y1="475" x2="300" y2="492" stroke="#15803d" stroke-width="3" />

    <!-- Sprout 3 -->
    <path d="M440 485 Q 425 460, 410 465 Q 425 475, 440 485 Z" fill="#86efac" />
    <path d="M440 485 Q 455 460, 470 465 Q 455 475, 440 485 Z" fill="#86efac" />
    <line x1="440" y1="485" x2="440" y2="502" stroke="#15803d" stroke-width="3" />
  </g>

  <!-- Decorative Badge Overlay in SVG -->
  <g transform="translate(40, 40)">
    <rect width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="24" cy="21" r="10" fill="#15803d" />
    <path d="M20 21 L 23 24 L 28 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#15803d">AgroMitra Krushi</text>
  </g>
</svg>
